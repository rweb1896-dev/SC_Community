spring.application.name=sc-community-connect
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript,image/svg+xml
debug=false
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=never
server.error.include-message=always
spring.mvc.problemdetails.enabled=true
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=INFO

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sc_con}
spring.datasource.username=${DB_USERNAME:${USER:postgres}}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.schema=${DB_SCHEMA:public}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:public}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.sql.init.mode=${SPRING_SQL_INIT_MODE:never}
spring.jpa.defer-datasource-initialization=true

app.jwt.secret=${JWT_SECRET:change-this-development-secret-change-this-development-secret}
app.jwt.expiration-ms=86400000
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4201,http://127.0.0.1:4201}
app.otp.email-code=${APP_OTP_EMAIL_CODE:SC1E}
app.otp.mobile-code=${APP_OTP_MOBILE_CODE:SC2M}
app.otp.expose-code=${APP_OTP_EXPOSE_CODE:true}
app.otp.expiry-minutes=${APP_OTP_EXPIRY_MINUTES:10}
app.otp.resend-cooldown-seconds=${APP_OTP_RESEND_COOLDOWN_SECONDS:30}
app.gallery.max-upload-bytes=${APP_GALLERY_MAX_UPLOAD_BYTES:8388608}

spring.servlet.multipart.max-file-size=${MAX_GALLERY_FILE_SIZE:8MB}
spring.servlet.multipart.max-request-size=${MAX_GALLERY_REQUEST_SIZE:9MB}
app.bootstrap.default-invite-enabled=${BOOTSTRAP_DEFAULT_INVITE_ENABLED:true}
app.bootstrap.sample-content-enabled=${BOOTSTRAP_SAMPLE_CONTENT_ENABLED:true}

spring.web.resources.cache.cachecontrol.max-age=365d
spring.web.resources.cache.cachecontrol.cache-public=true
